name: release

# Cuts the GitHub release for a version tag.
#
# Composer installs versions straight from git tags, so the pushed tag itself is
# the release; this workflow proves the tag is safe and consumable, then publishes
# the GitHub release. Creating the tag is the privileged act: the "release-tags"
# ruleset lets only repository admins create `v*` tags, and the `release`
# environment accepts only `v*` refs. Required-reviewer gates are not available on
# this plan, so the tag ruleset is the gate.
#
# Flow: the same CI gate every pull request passes (ci.yml, via workflow_call) ->
# the tag must equal Library::VERSION, have a dated CHANGELOG section and point at
# a commit on main -> install sfere-io/sfere-laravel:VERSION from this repository
# into a fresh project, as an app would, and check the installed version -> GitHub
# release with the CHANGELOG section as notes and the Composer archive attached
# -> notify Packagist when its credentials are configured -> once the repository
# is public, wait for packagist.org to list the version and install it from there,
# the way every app will.
#
# A tag never moves (the "protect-tags" ruleset): apps that installed a version
# must keep getting the same code. To ship a fix, bump Library::VERSION and tag
# again. Developer-facing instructions: docs/ci-cd.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "the tag is on main" is checked below
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      # Tag format, tag == Library::VERSION, and a dated, non-empty CHANGELOG
      # section, which becomes the release notes (.github/scripts/check-release.php).
      - name: Resolve and check the version
        run: |
          TAG="${GITHUB_REF_NAME}"
          php .github/scripts/check-release.php "$TAG" "$RUNNER_TEMP/notes.md"
          VERSION="${TAG#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${TAG} points at ${GITHUB_SHA::7}, which is not on main. Release only what went through a pull request."
            exit 1
          fi
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "VERSION=$VERSION"       >> "$GITHUB_ENV"
          echo "TAG=$TAG"               >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "::notice::Releasing sfere-io/sfere-laravel ${VERSION} (prerelease=${PRERELEASE})."

      - name: Composer archive
        run: |
          composer archive --format=zip --dir="$RUNNER_TEMP/dist" --file="sfere-laravel-${VERSION}"
          ZIP="$RUNNER_TEMP/dist/sfere-laravel-${VERSION}.zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # The tag as an app consumes it: Composer resolves sfere-io/sfere-laravel:VERSION
      # from this repository (a `vcs` repository, authenticated with the Actions
      # token while the repository is private) and installs it with its dependencies.
      - name: Install the tagged version as an app would
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP="$RUNNER_TEMP/consumer"
          mkdir -p "$APP"
          cd "$APP"
          composer config --global github-oauth.github.com "$GITHUB_TOKEN"
          cat > composer.json <<JSON
          {
            "name": "sfere/release-check",
            "require": { "sfere-io/sfere-laravel": "${VERSION}" },
            "repositories": [{ "type": "vcs", "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" }]
          }
          JSON
          composer install --prefer-dist --no-interaction --no-progress
          INSTALLED="$(php -r 'require "vendor/autoload.php"; echo Sfere\Support\Library::VERSION;')"
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "::error::Composer installed Library::VERSION=${INSTALLED} for ${TAG}, expected ${VERSION}."
            exit 1
          fi
          composer show sfere-io/sfere-laravel | grep -E '^(versions|source|dist)'
          echo "::notice::sfere-io/sfere-laravel ${VERSION} installs from the tag."

      - name: Release notes from the CHANGELOG
        run: |
          {
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "composer require sfere-io/sfere-laravel:^${VERSION}"
            echo '```'
            echo
            echo "While the repository is private, add it as a \`vcs\` repository and give Composer a GitHub token with read access (docs/ci-cd.md, \"Consuming the package\")."
            echo
            echo "Composer archive sha256: \`${ZIP_SHA256}\`"
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "${ARGS[@]}" "$ZIP"
          {
            echo "### Released sfere-io/sfere-laravel ${VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${TAG}\` |"
            echo "| Release | https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG} |"
            echo "| Archive sha256 | \`${ZIP_SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only needed when the Packagist GitHub integration is not connected (the
      # webhook makes Packagist read new tags by itself). Set the repository secrets
      # PACKAGIST_USERNAME and PACKAGIST_TOKEN (Packagist profile -> the "safe" API token).
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        if: env.PACKAGIST_USERNAME != '' && env.PACKAGIST_TOKEN != ''
        run: |
          curl --fail-with-body -sS --proto '=https' -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"repository\":{\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}\"}}"

      # packagist.org is where apps get the package. It serves public repositories
      # only, so while this one is private the step records why it did not run.
      # Once public: wait for Packagist to list the version (its webhook, or the
      # notification above, makes it re-read the tags), then install it from
      # packagist.org alone, with no GitHub repository or token configured.
      - name: Verify the version on packagist.org
        env:
          PUBLIC: ${{ github.event.repository.private == false }}
        run: |
          if [ "$PUBLIC" != "true" ]; then
            echo "The repository is private, so packagist.org cannot serve it yet; the vcs install above is the check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          META="https://repo.packagist.org/p2/sfere-io/sfere-laravel.json"
          for attempt in $(seq 1 40); do
            if curl -fsSL --proto '=https' "$META?t=$(date +%s)" \
                 | php -r '$m = json_decode(stream_get_contents(STDIN), true); foreach ($m["packages"]["sfere-io/sfere-laravel"] ?? [] as $p) { if (($p["version"] ?? "") === $argv[1]) exit(0); } exit(1);' "$VERSION"; then
              echo "packagist.org lists ${VERSION} (attempt ${attempt})."
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::packagist.org does not list sfere-io/sfere-laravel ${VERSION} after 10 minutes. Check the package's page on packagist.org (is the GitHub hook connected?)."
              exit 1
            fi
            sleep 15
          done
          APP="$RUNNER_TEMP/packagist-consumer"
          mkdir -p "$APP"
          cd "$APP"
          printf '{"name": "sfere/packagist-check", "require": {"sfere-io/sfere-laravel": "%s"}}\n' "$VERSION" > composer.json
          # A fresh Composer home: no token from the step above, as an app developer has.
          COMPOSER_HOME="$RUNNER_TEMP/composer-anonymous" composer install --prefer-dist --no-interaction --no-progress
          INSTALLED="$(php -r 'require "vendor/autoload.php"; echo Sfere\Support\Library::VERSION;')"
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "::error::packagist.org installed Library::VERSION=${INSTALLED}, expected ${VERSION}."
            exit 1
          fi
          echo "::notice::sfere-io/sfere-laravel ${VERSION} installs from packagist.org."
