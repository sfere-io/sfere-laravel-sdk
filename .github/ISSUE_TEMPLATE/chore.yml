name: Chore
description: Repo upkeep — tooling, CI, dependencies, docs, release process
labels: ["type:chore", "status:triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What is broken, slow, confusing, or missing today?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CI / GitHub workflows
        - Release / distribution
        - Dependencies
        - Documentation
        - Tooling (Pint, PHPStan, BC check, hooks)
        - Laravel / PHP version support
        - Other
    validations:
      required: true
