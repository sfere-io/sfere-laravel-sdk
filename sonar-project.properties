# SonarQube Cloud, run by the "SonarQube" job in .github/workflows/ci.yml.
sonar.projectKey=sfere-io_sfere-laravel-sdk
sonar.organization=sfere-io
sonar.projectName=sfere-laravel-sdk

sonar.sources=src,config
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Written by the "Tests & coverage" job (PHPUnit with pcov), restored as an artifact.
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/logs/junit.xml

# A failed quality gate fails the job.
sonar.qualitygate.wait=true
